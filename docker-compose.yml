services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: travel_assist
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - travel_assist_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel_assist"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://travel:${POSTGRES_PASSWORD:-change-me}@db:5432/travel_assist
      DATABASE_URL_DIRECT: postgresql+psycopg://travel:${POSTGRES_PASSWORD:-change-me}@db:5432/travel_assist
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      DEMO_MODE: ${DEMO_MODE:-false}
      AUTO_CREATE_TABLES: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  travel_assist_db:
