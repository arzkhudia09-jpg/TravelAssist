name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Configure Gradle memory for CI
        run: |
          mkdir -p "$HOME/.gradle"
          printf '%s\n' 'org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' >> "$HOME/.gradle/gradle.properties"
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle --no-daemon assembleDebug testDebugUnitTest
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: travel-assist-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
